[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent"
version = "0.1.0"
description = "Robinhood MCP trading agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.10,<2",
  "anthropic>=0.50",
  "pandas",
  "numpy",
  "matplotlib",
  "yfinance",
]

[project.scripts]
rh-agent = "rh_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["rh_agent*"]
